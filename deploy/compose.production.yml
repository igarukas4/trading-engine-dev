name: trading-engine

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: ${CADDY_IMAGE:?set CADDY_IMAGE to an immutable image digest in the release environment}
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in the release environment}
      CADDY_BASIC_AUTH_USER: ${CADDY_BASIC_AUTH_USER:?set CADDY_BASIC_AUTH_USER in the release environment}
      DOMAIN: ${DOMAIN:?set DOMAIN in the release environment}
    command:
      - /bin/sh
      - -ec
      - |
        export CADDY_BASIC_AUTH_HASH="$$(cat /run/secrets/caddy_basic_auth_hash)"
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    secrets:
      - caddy_basic_auth_hash
    networks:
      public: {}
      private:
        ipv4_address: 172.30.0.2
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE to an immutable image digest in the release environment}
    restart: unless-stopped
    logging: *default-logging
    environment:
      APP_SECRET_KEY_FILE: /run/secrets/app_secret_key
      DATABASE_HOST: postgres
      DATABASE_NAME: trading_engine
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      DATABASE_PORT: "5432"
      DATABASE_USER: trading_engine
      PUBLIC_ORIGIN: https://${DOMAIN:?set DOMAIN in the release environment}
      REDIS_HOST: redis
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      REDIS_PORT: "6379"
      TRUSTED_ACTOR_HEADER: X-Authenticated-User
      TRUSTED_PROXY_IPS: 172.30.0.2
    secrets:
      - app_secret_key
      - postgres_password
      - redis_password
    networks:
      - private
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/live', timeout=3).read()\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  migrate:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE to an immutable image digest in the release environment}
    restart: "no"
    environment:
      DATABASE_HOST: postgres
      DATABASE_NAME: trading_engine
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      DATABASE_PORT: "5432"
      DATABASE_USER: trading_engine
    command: ["python", "-m", "app.migrate"]
    secrets:
      - postgres_password
    networks:
      - private
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: ${TIMESCALEDB_IMAGE:?set TIMESCALEDB_IMAGE to an immutable image digest in the release environment}
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: trading_engine
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_USER: trading_engine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - postgres_password
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_engine -d trading_engine"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: ${REDIS_IMAGE:?set REDIS_IMAGE to an immutable image digest in the release environment}
    restart: unless-stopped
    logging: *default-logging
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        {
          printf '%s\n' 'appendonly yes'
          printf 'requirepass %s\n' "$$(cat /run/secrets/redis_password)"
        } > /tmp/redis.conf
        exec redis-server /tmp/redis.conf
    volumes:
      - redis_data:/data
    secrets:
      - redis_password
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli --no-auth-warning ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  public: {}
  private:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  caddy_config: {}
  caddy_data: {}
  caddy_logs: {}
  postgres_data: {}
  redis_data: {}

secrets:
  app_secret_key:
    file: ./secrets/app_secret_key
  caddy_basic_auth_hash:
    file: ./secrets/caddy_basic_auth_hash
  postgres_password:
    file: ./secrets/postgres_password
  redis_password:
    file: ./secrets/redis_password
